name: Deploy one service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      image:
        required: true
        type: string
    secrets:
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true
      GHCR_USERNAME:
        required: true
      GHCR_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ inputs.service }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mydata/production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate image reference
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ inputs.image }}
        run: |
          case "$SERVICE" in
            platform-backend|education-backend|social-backend|pokerworld-backend|business-backend|platform-frontend|education-frontend|pokerworld-frontend|business-frontend) ;;
            *) echo "Unknown service: $SERVICE" >&2; exit 1 ;;
          esac
          if [[ ! "$IMAGE" =~ ^ghcr\.io/my-dataorg/${SERVICE}@sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image: $IMAGE" >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Prepare server and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST")

          "${SSH[@]}" "bash -s" < .github/scripts/emergency-disk-cleanup.sh

          "${SSH[@]}" "mkdir -p '$DEPLOY_PATH' || (sudo mkdir -p '$DEPLOY_PATH' && sudo chown \"\$(whoami):\$(whoami)\" '$DEPLOY_PATH')"

          "${SSH[@]}" "cat > '$DEPLOY_PATH/docker-free-disk.sh'" < .github/scripts/docker-free-disk.sh
          "${SSH[@]}" "cat > '$DEPLOY_PATH/deploy-one-service.sh'" < .github/scripts/deploy-one-service.sh
          "${SSH[@]}" "chmod +x '$DEPLOY_PATH/docker-free-disk.sh' '$DEPLOY_PATH/deploy-one-service.sh'"

          printf '%s' "$GHCR_TOKEN" | "${SSH[@]}" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

          "${SSH[@]}" "DEPLOY_PATH='$DEPLOY_PATH' SERVICE='$SERVICE' IMAGE='$IMAGE' '$DEPLOY_PATH/deploy-one-service.sh'"
